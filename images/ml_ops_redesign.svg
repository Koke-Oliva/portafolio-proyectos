<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Breast Cancer API — MLOps</title>
<desc id="desc">Visual de un flujo MLOps para una API de clasificación de cáncer de mama.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071a3f"/>
    <stop offset="58%" stop-color="#0a2a6b"/>
    <stop offset="100%" stop-color="#07142d"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#d8efff"/>
    <stop offset="55%" stop-color="#7dc9ff"/>
    <stop offset="100%" stop-color="#f2a6ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="675" fill="url(#bg)"/>

<g opacity=".16" stroke="#56a8ff" stroke-width="2" fill="none">
  <path d="M1010 60l34-20 34 20v40l-34 20-34-20z"/>
  <path d="M1078 100l34-20 34 20v40l-34 20-34-20z"/>
  <path d="M1010 140l34-20 34 20v40l-34 20-34-20z"/>
  <path d="M70 545l26-15 26 15v30l-26 15-26-15z"/>
  <path d="M122 575l26-15 26 15v30l-26 15-26-15z"/>
</g>

<!-- Breast / tumor motif -->
