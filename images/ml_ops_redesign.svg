  <circle cx="128" cy="377" r="48" fill="#ff8bd1" opacity=".28" filter="url(#glow)"/>
  <circle cx="128" cy="377" r="25" fill="#ff98d9" opacity=".95"/>
  <g stroke="#ffb9e8" stroke-width="3" stroke-dasharray="8 6" opacity=".72">
